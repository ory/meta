name: Workflows

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - v3

permissions:
  contents: read

jobs:
  check:
    name: Check workflow templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-workflows.sh
